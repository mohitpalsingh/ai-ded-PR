name: CI
on: [push, pull_request]
jobs:
  test:
    # Apple Silicon runner: same architecture we target (Metal, darwin/arm64).
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race ./...
      - run: test -z "$(gofmt -l cmd internal)"
      - run: go mod tidy -diff
      - run: bash -n scripts/install.sh && bash -n scripts/uninstall.sh && bash -n scripts/regression.sh && bash -n scripts/make-large-pr-fixture.sh && bash -n scripts/make-regression-fixture.sh
      - run: python3 -m py_compile scripts/ansi2svg.py
