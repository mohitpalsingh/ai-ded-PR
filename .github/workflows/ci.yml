name: CI
on: [push, pull_request]
jobs:
  test:
    # Apple Silicon runner: same architecture we target (Metal, darwin/arm64).
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race ./...
      - run: bash -n scripts/install.sh && bash -n scripts/uninstall.sh && bash -n scripts/regression.sh
